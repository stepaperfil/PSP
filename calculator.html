<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор в стиле Точки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="#calculator-section" class="logo">Точка</a>
        <button id="btn_op_bgcolor" class="header-btn">🎨</button>
    </header>
    <main class="main" id="calculator-section">
        <div class="calculator">
            <div class="display-container">
                <div id="result" class="result">
                    <span class="result-value">0</span>
                </div>
                <div id="preview" class="preview"></div>
            </div>

            <div class="memory-controls">
                <span id="btn_op_mplus_text">M+</span>
                <span class="memory-separator">|</span>
                <span id="btn_op_mminus_text">M-</span>
                <span class="memory-separator">|</span>
                <span id="btn_op_resultcolor">🖍️</span>
            </div>

            <div class="row">
                <button id="btn_op_square" class="my-btn secondary">x²</button>
                <button id="btn_op_lg" class="my-btn secondary">lg</button>
                <button id="btn_op_ln" class="my-btn secondary">ln</button>
                <button id="btn_op_sin" class="my-btn secondary">sin</button>
                <button id="btn_op_cos" class="my-btn secondary">cos</button>
            </div>

            <div class="row">
                <button id="btn_op_sqrt" class="my-btn secondary">√</button>
                <button id="btn_op_percent" class="my-btn secondary">%</button>
                <button id="btn_op_clear" class="my-btn secondary">C</button>
                <button id="btn_op_backspace" class="my-btn secondary">⌫</button>
                <button id="btn_op_div" class="my-btn secondary">/</button>
            </div>

            <div class="row">
                <button id="btn_op_factorial" class="my-btn secondary">x!</button>
                <button id="btn_digit_7" class="my-btn">7</button>
                <button id="btn_digit_8" class="my-btn">8</button>
                <button id="btn_digit_9" class="my-btn">9</button>
                <button id="btn_op_mult" class="my-btn primary">×</button>
            </div>

            <div class="row">
                <button id="btn_op_reciprocal" class="my-btn secondary">1/x</button>
                <button id="btn_digit_4" class="my-btn">4</button>
                <button id="btn_digit_5" class="my-btn">5</button>
                <button id="btn_digit_6" class="my-btn">6</button>
                <button id="btn_op_minus" class="my-btn primary">–</button>
            </div>

            <div class="row">
                <button id="btn_op_000" class="my-btn secondary">000</button>
                <button id="btn_digit_1" class="my-btn">1</button>
                <button id="btn_digit_2" class="my-btn">2</button>
                <button id="btn_digit_3" class="my-btn">3</button>
                <button id="btn_op_plus" class="my-btn primary">+</button>
            </div>

            <div class="row last-row">

                <button id="btn_op_sign" class="my-btn secondary">±</button>
                <button id="btn_digit_0" class="my-btn">0</button>
                <button id="btn_digit_dot" class="my-btn">.</button>
                <button id="btn_op_equal" class="my-btn primary execute">=</button>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-section">
            <h4>Контакты</h4>
            <p>📞 +7 (123) 456-78-90</p>
            <p>✉️ support@tochka.ru</p>
        </div>
        <div class="footer-section">
            <h4>Адрес</h4>
            <p>г. Москва, ул. Бауманская, д. 1</p>
        </div>
        <div class="footer-section">
            <h4>Соцсети</h4>
            <p><a href="https://t.me\otkins">Telegram</a></p>
            <p><a href="https://vk.com\otk1ns">ВКонтакте</a></p>
            <p><a href="https://github.com/stepaperfil/PSP/tree/main/Calculator.%20HTML%20CSS">GitHub</a></p>
        </div>
        <div class="footer-section">
            <h4>Ссылки</h4>
            <p><a href="info.html" class="info-link">Информация о лабораторной работе</a></p>
        </div>
    </footer>
    <div class="copyright">
        © 2026 Точка Банк. Все права защищены.
    </div>
    <script type="text/javascript" src="script.js"></script>
</body>
</html>
